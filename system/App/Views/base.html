<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Lupa</title>
    <link rel="stylesheet" href="https://use.typekit.net/jrp0gtx.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/sections.css">
  </head>
  <body>
    <header class="site-header">
      <a class="site-header__logo" href="./" aria-label="Volver al inicio de Lupa">
        <img src="img/logo-lupa.svg" alt="Lupa">
      </a>

      <button
        class="menu-toggle"
        type="button"
        aria-label="Abrir menú"
        aria-expanded="false"
        aria-controls="site-menu"
      >
        <img class="menu-toggle__icon menu-toggle__icon--menu" src="img/hamburguer.svg" alt="" aria-hidden="true">
        <!-- X PROVISIONAL: reemplazar cuando llegue el diseño del menú abierto de la agencia. -->
        <img class="menu-toggle__icon menu-toggle__icon--close" src="img/close-x.svg" alt="" aria-hidden="true">
      </button>
    </header>

    <!-- Placeholder provisional: reemplazar cuando llegue el diseño definitivo del menú 2026. -->
    <nav class="site-menu" id="site-menu" aria-label="Menú principal" aria-hidden="true">
      <ul class="site-menu__list">
        <li><a href="./">Home</a></li>
        <li><a href="#ofertas">Ofertas</a></li>
        <li><a href="#cupones">Cupones</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__stage">
          <h1 class="visually-hidden" id="hero-title">OFERTITI - LA REINA DE LAS OFERTAS</h1>
          <img class="hero__clouds" src="img/hero/nubes.webp" alt="" width="507" height="141">
          <img class="hero__lockup" src="img/hero/lockup-ofertiti.webp" alt="" width="900" height="596" fetchpriority="high">
          <img class="hero__balloon" src="img/hero/globo.webp" alt="Desliza hacia abajo para continuar" width="691" height="300">
          <img class="hero__sand" src="img/hero/arena.webp" alt="" width="900" height="145">
          <img class="hero__sphinx" src="img/hero/esfinge.webp" alt="" width="683" height="319">
          <img class="hero__ofertiti" src="img/hero/ofertiti.webp" alt="" width="711" height="1539" fetchpriority="high">
          <!-- Este ancla llevará al formulario cuando exista esa sección. -->
          <a class="hero__skip" href="#formulario">SALTAR INTRO</a>
        </div>
      </section>
    </main>
    <script src="js/header.js"></script>
  </body>
</html>
