<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Lupa</title>
    <link rel="stylesheet" href="https://use.typekit.net/jrp0gtx.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/sections.css">
  </head>
  <body>
    <header class="site-header">
      <a class="site-header__logo" href="./" aria-label="Volver al inicio de Lupa">
        <img src="img/logo-lupa.svg" alt="Lupa">
      </a>

      <button
        class="menu-toggle"
        type="button"
        aria-label="Abrir menú"
        aria-expanded="false"
        aria-controls="site-menu"
      >
        <img class="menu-toggle__icon menu-toggle__icon--menu" src="img/hamburguer.svg" alt="" aria-hidden="true">
        <!-- X PROVISIONAL: reemplazar cuando llegue el diseño del menú abierto de la agencia. -->
        <img class="menu-toggle__icon menu-toggle__icon--close" src="img/close-x.svg" alt="" aria-hidden="true">
      </button>
    </header>

    <!-- Placeholder provisional: reemplazar cuando llegue el diseño definitivo del menú 2026. -->
    <nav class="site-menu" id="site-menu" aria-label="Menú principal" aria-hidden="true">
      <ul class="site-menu__list">
        <li><a href="./">Home</a></li>
        <li><a href="#ofertas">Ofertas</a></li>
        <li><a href="#cupones">Cupones</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__sticky">
          <div class="hero__stage" data-estado="intro">
            <h1 class="visually-hidden" id="hero-title">OFERTITI - LA REINA DE LAS OFERTAS</h1>
            <img class="hero__clouds" src="img/intro/nube-1.webp" alt="" width="507" height="141">
            <img class="hero__lockup" src="img/intro/lockup-ofertiti.webp" alt="" width="1029" height="681" fetchpriority="high">
            <div class="hero__prompt-group">
              <img class="hero__balloon" src="img/intro/globo.webp" alt="" width="1100" height="478">
              <p class="hero__prompt">DESLIZA HACIA ABAJO PARA CONTINUAR</p>
            </div>
            <div class="hero__sphinx-group">
              <img class="hero__sphinx-ground" src="img/intro/arena-cerca.webp" alt="" width="1503" height="354">
              <img class="hero__sphinx" src="img/intro/esfinge.webp" alt="" width="2048" height="956">
            </div>
            <img class="hero__ofertiti" src="img/intro/ofertiti.webp" alt="" width="711" height="1539" fetchpriority="high">
            <img class="hero__cloud-two" src="img/intro/nube-2.webp" alt="" width="437" height="202">
            <img class="hero__cloud-three" src="img/intro/nube-2.webp" alt="" width="437" height="202">
            <div class="hero__riddle-group">
              <img class="hero__riddle-balloon" src="img/intro/globo.webp" alt="" width="1100" height="478">
              <p class="hero__riddle hero__riddle--intro">Tres preguntas harás, y si aciertas el producto, a la pirámide entrarás</p>
            </div>
            <div class="hero__question-ui" inert aria-hidden="true">
              <div class="hero__riddle-group">
                <img class="hero__riddle-balloon--answer" src="img/acertijo/nube-rta.webp" alt="" width="1025" height="445">
                <p class="hero__riddle hero__riddle--answer">SE ACABARON LAS PREGUNTAS. ¿CUÁL ES?</p>
              </div>
              <div class="hero__options" role="radiogroup" aria-label="Opciones de respuesta"></div>
              <button class="hero__continue" type="button" disabled>
                <span>PUEDES CONTINUAR</span>
              </button>
            </div>
            <!-- Salida permanente de la experiencia: visible en todos los estados. -->
            <a class="hero__skip" href="#formulario">SALTAR INTRO</a>
            <!-- Provisional: este botón abrirá el popup de los pergaminos. -->
            <button class="hero__start" type="button">
              <span>EMPEZAR</span>
            </button>
          </div>
        </div>
        <div class="acertijo-panel-rail acertijo-panel-rail--intro" aria-hidden="true"></div>
        <div class="acertijo-panel-rail acertijo-panel-rail--entrada" aria-hidden="true"></div>
        <div class="acertijo-panel-rail acertijo-panel-rail--salida" aria-hidden="true"></div>
        <div class="acertijo-panel-rail acertijo-panel-rail--quiz" aria-hidden="true"></div>
      </section>
    </main>
    <section class="acertijo-panel" aria-label="Acertijo de Ofertiti" aria-hidden="true">
      <img class="acertijo-panel__background" src="img/acertijo/panel-papiro.webp" alt="" width="1125" height="1972">
      <div class="acertijo-panel__questions"></div>
    </section>
    <script src="js/header.js"></script>
    <script type="module" src="js/intro-scroll.js"></script>
    <script type="module" src="js/acertijo.js"></script>
    <script type="module" src="js/pregunta.js"></script>
  </body>
</html>
